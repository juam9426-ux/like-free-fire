<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>K4GXP - Painel Free Fire</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080910;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #12131c;
      border-bottom: 1px solid #292b38;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      color: #a970ff;
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      color: #aaa;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 25px auto;
    }

    .card {
      background: #11131c;
      border: 1px solid #292b38;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }

    .card h2 {
      color: #b77aff;
      margin-bottom: 15px;
      font-size: 20px;
    }

    label {
      display: block;
      color: #bbb;
      margin: 12px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #343747;
      background: #080910;
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #a970ff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #a970ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat {
      background: #080910;
      border: 1px solid #292b38;
      border-radius: 12px;
      padding: 15px;
    }

    .stat span {
      display: block;
      color: #999;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .stat strong {
      font-size: 20px;
    }

    .success {
      color: #46e6a0;
    }

    .error {
      color: #ff5d6c;
    }

    .history {
      border-top: 1px solid #292b38;
      margin-top: 15px;
    }

    .history-item {
      padding: 13px 0;
      border-bottom: 1px solid #292b38;
    }

    .history-item small {
      color: #888;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px;
      font-size: 13px;
    }

    #mensagem {
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
    }

    @media (max-width: 450px) {
      .stats {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🔥 K4GXP</h1>
    <p>Painel de controle Free Fire</p>
  </header>

  <main class="container">

    <section class="card">
      <h2>👤 Consultar conta</h2>

      <label for="id">ID da conta</label>

      <input
        id="id"
        type="text"
        placeholder="Digite o ID do jogador"
        autocomplete="off"
      >

      <button onclick="consultarConta()">
        Consultar
      </button>

      <div id="mensagem"></div>
    </section>

    <section class="card">
      <h2>📊 Informações</h2>

      <div class="stats">

        <div class="stat">
          <span>ID</span>
          <strong id="contaId">---</strong>
        </div>

        <div class="stat">
          <span>Apelido</span>
          <strong id="apelido">---</strong>
        </div>

        <div class="stat">
          <span>Saldo</span>
          <strong id="saldo">R$ 0,00</strong>
        </div>

        <div class="stat">
          <span>Gasto</span>
          <strong id="gasto">R$ 0,00</strong>
        </div>

        <div class="stat">
          <span>Região</span>
          <strong id="regiao">---</strong>
        </div>

        <div class="stat">
          <span>Status</span>
          <strong class="success" id="status">
            Online
          </strong>
        </div>

      </div>
    </section>

    <section class="card">
      <h2>📜 Histórico</h2>

      <div id="historico">
        <p style="color:#888">
          Nenhum histórico carregado.
        </p>
      </div>
    </section>

  </main>

  <footer>
    K4GXP © 2026
  </footer>

  <script>

    function dinheiro(valor) {
      return Number(valor || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    async function consultarConta() {

      const id = document.getElementById("id").value.trim();
      const mensagem = document.getElementById("mensagem");

      if (!id) {
        mensagem.innerHTML =
          '<span class="error">Digite o ID da conta.</span>';
        return;
      }

      mensagem.innerHTML =
        '<span>Consultando...</span>';

      /*
        IMPORTANTE:

        NÃO coloque sua API key aqui.

        A chave da API deve ficar no servidor/backend,
        e não dentro deste arquivo HTML público.
      */

      try {

        /*
          Quando criarmos o backend da API,
          esta chamada será:

          /api/conta?id=SEU_ID
        */

        const resposta = await fetch(
          "/api/conta?id=" + encodeURIComponent(id)
        );

        if (!resposta.ok) {
          throw new Error("Erro na API");
        }

        const json = await resposta.json();

        if (!json || !json.data) {
          throw new Error("Resposta inválida");
        }

        const dados = json.data;

        document.getElementById("contaId").textContent =
          dados.id || "---";

        document.getElementById("apelido").textContent =
          dados.apelido || "---";

        document.getElementById("saldo").textContent =
          dinheiro(dados.saldo);

        document.getElementById("gasto").textContent =
          dinheiro(dados.gasto);

        document.getElementById("regiao").textContent =
          dados.region || "---";

        document.getElementById("status").textContent =
          "OK";

        carregarHistorico(dados.historico);

        mensagem.innerHTML =
          '<span class="success">Consulta realizada!</span>';

      } catch (erro) {

        console.error(erro);

        mensagem.innerHTML =
          '<span class="error">A API ainda não está conectada.</span>';

      }
    }


    function carregarHistorico(historico) {

      const elemento =
        document.getElementById("historico");

      if (!Array.isArray(historico) ||
          historico.length === 0) {

        elemento.innerHTML =
          '<p style="color:#888">Nenhum histórico disponível.</p>';

        return;
      }

      elemento.innerHTML =
        historico.map(item => {

          return `
            <div class="history-item">
              <strong>
                ${item.nome || item.tipo || "Operação"}
              </strong>

              <br>

              <small>
                ${item.data || ""}
              </small>
            </div>
          `;

        }).join("");
    }

  </script>

</body>
</html>
